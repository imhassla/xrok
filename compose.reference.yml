name: xrok-reference
services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["reference-redis:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 2s, retries: 10 }
  postgres:
    image: postgres:17.2-alpine
    environment: ["POSTGRES_USER=xrok", "POSTGRES_PASSWORD=xrok-local", "POSTGRES_DB=xrok"]
    volumes: ["reference-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U xrok -d xrok"], interval: 5s, timeout: 2s, retries: 10 }
  coturn:
    image: coturn/coturn:4.6.3
    command: ["-n", "--no-cli", "--log-file=stdout", "--listening-port=3478", "--min-port=49160", "--max-port=49200", "--realm=xrok.local", "--lt-cred-mech", "--user=matrix:matrix-pass"]
    ports: ["3478:3478/udp", "49160-49200:49160-49200/udp"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./bench/otel-reference.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/"], interval: 5s, timeout: 2s, retries: 10 }
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./bench/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "reference-prometheus:/prometheus"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    environment: ["GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin"]
    volumes: ["reference-grafana:/var/lib/grafana", "./bench/grafana:/etc/grafana:ro"]
    ports: ["3000:3000"]
  toxiproxy:
    image: shopify/toxiproxy:2.9.0
    ports: ["8474:8474", "18080:18080", "18443:18443"]
volumes: { reference-redis: {}, reference-postgres: {}, reference-prometheus: {}, reference-grafana: {} }
