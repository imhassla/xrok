name: xrok-ha-local

# Fully local HA exercise. Redis/Postgres provide the control-plane dependencies
# used by integration tests; xrok replicas keep independent state files so a
# restart/failover never corrupts the on-disk journal.
services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["ha-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: xrok
      POSTGRES_USER: xrok
      POSTGRES_PASSWORD: xrok-local
    volumes: ["ha-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrok -d xrok"]
      interval: 5s
      timeout: 3s
      retries: 10

  xrok-a:
    build: .
    command: ["server", "--domain", "localhost", "--port", "8443", "--tls-cert", "/certs/server.pem", "--tls-key", "/certs/server-key.pem", "--state-file", "/data/state-a.dat", "--log-file", "/data/server-a.log"]
    environment:
      XROK_API_TOKEN: ${XROK_API_TOKEN:-local-ha-token}
      XROK_HA_REDIS_ADDR: redis:6379
      XROK_HA_POSTGRES_DSN: postgres://xrok:xrok-local@postgres:5432/xrok?sslmode=disable
    ports: ["${XROK_HA_PORT_A:-8443}:8443/tcp", "${XROK_HA_UDP_A:-8443}:8443/udp"]
    volumes: ["./local-certs:/certs:ro", "xrok-a-data:/data"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/xrok", "status", "--help"]
      interval: 10s
      timeout: 3s
      retries: 10

  xrok-b:
    build: .
    command: ["server", "--domain", "localhost", "--port", "8444", "--tls-cert", "/certs/server.pem", "--tls-key", "/certs/server-key.pem", "--state-file", "/data/state-b.dat", "--log-file", "/data/server-b.log"]
    environment:
      XROK_API_TOKEN: ${XROK_API_TOKEN:-local-ha-token}
      XROK_HA_REDIS_ADDR: redis:6379
      XROK_HA_POSTGRES_DSN: postgres://xrok:xrok-local@postgres:5432/xrok?sslmode=disable
    ports: ["${XROK_HA_PORT_B:-9443}:8444/tcp", "${XROK_HA_UDP_B:-9443}:8444/udp"]
    volumes: ["./local-certs:/certs:ro", "xrok-b-data:/data"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/xrok", "status", "--help"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  ha-redis:
  ha-postgres:
  xrok-a-data:
  xrok-b-data:
